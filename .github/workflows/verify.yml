# Adapted from the laboratory's publication CI template.
name: Certificate packet verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: PDF inspection dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # No pip dependencies. Optional heavy integrations are excluded.
      - name: Same checks as README and clean-clone preflight
        run: python3 -B check_all.py
